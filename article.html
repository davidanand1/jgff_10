<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JG&FF | Article</title>
    <link rel="icon" href="/assets/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="/css/global.css">
    <link rel="stylesheet" href="/css/nav.css">
    <link rel="stylesheet" href="/css/article.css">
</head>
<body>
    <div class="page-wrapper">

        <section class="page-header">
            <div class="container">
                <a href="/index.html" class="btn btn-back">← Back to Home</a>
                <div id="articleHeader">
                    <div class="skeleton skeleton-text" style="width:60%;height:2rem;"></div>
                    <div class="skeleton skeleton-text" style="width:30%;margin-top:8px;"></div>
                </div>
            </div>
        </section>

        <section class="section">
            <div class="container article-layout">

                <!-- Article Body -->
                <div id="articleBody" class="article-body">
                    <div class="skeleton skeleton-text"></div>
                    <div class="skeleton skeleton-text"></div>
                    <div class="skeleton skeleton-text"></div>
                    <div class="skeleton skeleton-text" style="width:80%"></div>
                </div>

                <!-- Comment Section -->
                <div class="article-comments">
                    <h2 class="section-title">Comments</h2>

                    <div class="comment-form card">
                        <input
                            type="text"
                            id="commentName"
                            class="input-field"
                            placeholder="Your name"
                            maxlength="50"
                        >
                        <textarea
                            id="commentText"
                            class="input-field textarea-field"
                            placeholder="Leave a comment... (250 characters max)"
                            maxlength="250"
                        ></textarea>
                        <div class="form-footer">
                            <span id="charCount" class="char-count">250</span>
                            <button id="commentSubmit" class="btn btn-primary">Post</button>
                        </div>
                    </div>

                    <div id="commentFeed" class="chat-feed">
                        <div class="skeleton skeleton-card"></div>
                    </div>
                </div>

            </div>
        </section>

    </div>

    <script src="/js/config.js"></script>
    <script src="/js/nav.js"></script>
    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js';
        import { getDatabase, ref, push, onValue, serverTimestamp } from 'https://www.gstatic.com/firebasejs/10.7.0/firebase-database.js';

        (async () => {
            await new Promise(resolve => {
                if (document.readyState === 'complete') resolve();
                else window.addEventListener('load', resolve);
            });

            const { FIREBASE, GOOGLE_API_KEY } = window.CONFIG;
            const app = initializeApp(FIREBASE);
            const db = getDatabase(app);

            // Get doc ID from URL
            const params = new URLSearchParams(window.location.search);
            const docId = params.get('id');

            if (!docId) {
                document.getElementById('articleBody').innerHTML =
                    '<p style="color:var(--text-muted)">Article not found.</p>';
                return;
            }

            // ── Fetch Google Doc ──
            // ── Fetch Google Doc ──
            async function fetchDoc() {
    try {
        const url = `https://www.googleapis.com/drive/v3/files/${docId}/export?mimeType=text/html&key=${GOOGLE_API_KEY}`;
        const res = await fetch(url);

        if (!res.ok) {
            document.getElementById('articleBody').innerHTML =
                '<p style="color:var(--text-muted)">Could not load article. Make sure the document is published to the web.</p>';
            return;
        }

        const html = await res.text();

        // Extract body content
        const bodyMatch = html.match(/<body[^>]*>([\s\S]*?)<\/body>/i);
        const bodyContent = bodyMatch ? bodyMatch[1] : html;

        // Parse into a temporary DOM element
        const parser = new DOMParser();
        const docDom = parser.parseFromString(bodyContent, 'text/html');

        // Strip all inline styles and Google classes
        docDom.querySelectorAll('[style]').forEach(el => el.removeAttribute('style'));
        docDom.querySelectorAll('[class]').forEach(el => el.removeAttribute('class'));

        // Get all paragraphs/headings as text blocks
        const blocks = Array.from(docDom.body.children);

        // First non-empty block = title
        // Second non-empty block = subtitle
        // Rest = body
        const nonEmpty = blocks.filter(b => b.textContent.trim().length > 0);
        console.log('blocks:', nonEmpty.map(b => ({ tag: b.tagName, text: b.textContent.trim().substring(0, 50) })));     
           
        const titleText = nonEmpty[0]?.textContent.trim() || 'Article';
        const subtitleText = nonEmpty[1]?.textContent.trim() || '';
        const bodyBlocks = nonEmpty.slice(2);

        // Update page title
        document.title = `JG&FF | ${titleText}`;

        // Render header
        document.getElementById('articleHeader').innerHTML = `
            <h1 class="article-title">${titleText}</h1>
            ${subtitleText ? `<p class="article-subtitle">${subtitleText}</p>` : ''}
        `;

        // Render body
        const bodyHtml = bodyBlocks.map(block => {
            const tag = block.tagName?.toLowerCase();
            const text = block.innerHTML;
            if (!text.trim()) return '';

            if (tag === 'h1') return `<h1 class="doc-h1">${text}</h1>`;
            if (tag === 'h2') return `<h2 class="doc-h2">${text}</h2>`;
            if (tag === 'h3') return `<h3 class="doc-h3">${text}</h3>`;
            if (tag === 'table') return `
                <div class="table-wrapper">
                    <table>${block.innerHTML}</table>
                </div>
            `;
            return `<p class="doc-p">${text}</p>`;
        }).join('');

        document.getElementById('articleBody').innerHTML = `
            <div class="doc-content">${bodyHtml}</div>
        `;

    } catch (err) {
        console.error('Doc fetch error:', err);
        document.getElementById('articleBody').innerHTML =
            '<p style="color:var(--text-muted)">Error loading article.</p>';
    }
}

            // ── Comments ──
            function initComments() {
                const commentPath = `article-comments/${docId}`;
                const commentRef = ref(db, commentPath);
                const nameInput = document.getElementById('commentName');
                const textInput = document.getElementById('commentText');
                const submitBtn = document.getElementById('commentSubmit');
                const charCount = document.getElementById('charCount');
                const feed = document.getElementById('commentFeed');

                textInput.addEventListener('input', () => {
                    const remaining = 250 - textInput.value.length;
                    charCount.textContent = remaining;
                    charCount.style.color = remaining < 20 ? 'var(--error)' : 'var(--text-muted)';
                });

                submitBtn.addEventListener('click', async () => {
                    const name = nameInput.value.trim();
                    const text = textInput.value.trim();
                    if (!name || !text) return;

                    submitBtn.disabled = true;
                    await push(commentRef, {
                        name,
                        text,
                        parentId: null,
                        timestamp: serverTimestamp()
                    });
                    textInput.value = '';
                    charCount.textContent = '250';
                    submitBtn.disabled = false;
                });

                onValue(commentRef, (snapshot) => {
                    const data = snapshot.val();
                    if (!data) {
                        feed.innerHTML = '<p class="no-comments">No comments yet. Be the first!</p>';
                        return;
                    }

                    const comments = Object.entries(data).map(([id, val]) => ({ id, ...val }));
                    comments.sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));

                    const topLevel = comments.filter(c => !c.parentId);
                    const replies = comments.filter(c => c.parentId);

                    feed.innerHTML = topLevel.map(comment => `
                        <div class="comment-thread">
                            ${renderComment(comment)}
                            <div class="replies">
                                ${replies
                                    .filter(r => r.parentId === comment.id)
                                    .sort((a, b) => (a.timestamp || 0) - (b.timestamp || 0))
                                    .map(r => renderComment(r, true))
                                    .join('')}
                            </div>
                            <button class="reply-toggle btn btn-secondary"
                                    onclick="toggleReplyForm('${comment.id}')">
                                Reply
                            </button>
                            <div class="reply-form" id="replyForm-${comment.id}" style="display:none;">
                                <input type="text" class="input-field" placeholder="Your name"
                                       id="replyName-${comment.id}" maxlength="50">
                                <textarea class="input-field textarea-field"
                                          placeholder="Your reply... (250 characters max)"
                                          id="replyText-${comment.id}" maxlength="250"></textarea>
                                <button class="btn btn-primary"
                                        onclick="submitReply('${comment.id}')">
                                    Post Reply
                                </button>
                            </div>
                        </div>
                    `).join('');
                });
            }

            function renderComment(comment, isReply = false) {
                const time = comment.timestamp
                    ? new Date(comment.timestamp).toLocaleDateString('en-US', {
                        month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit'
                      })
                    : 'Just now';
                return `
                    <div class="comment ${isReply ? 'comment-reply' : ''}">
                        <div class="comment-header">
                            <span class="comment-name">${escapeHtml(comment.name)}</span>
                            <span class="comment-time">${time}</span>
                        </div>
                        <p class="comment-text">${escapeHtml(comment.text)}</p>
                    </div>
                `;
            }

            window.toggleReplyForm = (id) => {
                const form = document.getElementById(`replyForm-${id}`);
                form.style.display = form.style.display === 'none' ? 'block' : 'none';
            };

            window.submitReply = async (parentId) => {
                const name = document.getElementById(`replyName-${parentId}`).value.trim();
                const text = document.getElementById(`replyText-${parentId}`).value.trim();
                if (!name || !text) return;

                const commentRef = ref(db, `article-comments/${docId}`);
                await push(commentRef, {
                    name,
                    text,
                    parentId,
                    timestamp: serverTimestamp()
                });
                document.getElementById(`replyForm-${parentId}`).style.display = 'none';
            };

            function escapeHtml(str) {
                const div = document.createElement('div');
                div.appendChild(document.createTextNode(str));
                return div.innerHTML;
            }

            // ── Init ──
            fetchDoc();
            initComments();

        })();
    </script>
</body>
</html>
