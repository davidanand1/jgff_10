<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JG&FF | Record Room</title>
    <meta name="description" content="JG&FF Fantasy Football League — Record Room">
    <link rel="icon" href="/assets/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="/css/global.css">
    <link rel="stylesheet" href="/css/nav.css">
    <link rel="stylesheet" href="/css/record-room.css">
</head>
<body>
    <div class="page-wrapper">

        <!-- ── HEADER ── -->
        <section class="page-header">
            <div class="container">
                <h1 class="page-title">Record Room</h1>
                <div class="gold-divider"></div>
            </div>
        </section>

        <!-- ── RECORDS ── -->
        <section class="section">
            <div class="container">
                <div id="recordsContainer" class="records-container">
                    <div class="skeleton skeleton-card"></div>
                    <div class="skeleton skeleton-card"></div>
                    <div class="skeleton skeleton-card"></div>
                </div>
            </div>
        </section>

    </div>

    <!-- Scripts -->
    <script src="/js/config.js"></script>
    <script src="/js/nav.js"></script>
    <script type="module">
        (async () => {
            await new Promise(resolve => {
                if (document.readyState === 'complete') resolve();
                else window.addEventListener('load', resolve);
            });

            const { GOOGLE_API_KEY, GOOGLE_SHEETS_ID } = window.CONFIG;

            // ── Fetch full tab ──
            async function fetchTab(tab) {
                const encoded = encodeURIComponent(tab);
                const url = `https://sheets.googleapis.com/v4/spreadsheets/${GOOGLE_SHEETS_ID}/values/${encoded}?key=${GOOGLE_API_KEY}`;
                const res = await fetch(url);
                const data = await res.json();
                return data.values || [];
            }

            // ── Parse tables ──
            function parseTables(rows) {
                const tables = [];
                let currentTable = null;

                for (let i = 0; i < rows.length; i++) {
                    const row = rows[i];
                    const isBlank = !row || row.every(c => !c || !c.trim());

                    if (isBlank) {
                        if (currentTable) {
                            tables.push(currentTable);
                            currentTable = null;
                        }
                        continue;
                    }

                    if (!currentTable) {
                        currentTable = {
                            title: row[0] || 'Untitled',
                            rows: []
                        };
                    } else {
                        currentTable.rows.push(row);
                    }
                }

                if (currentTable) tables.push(currentTable);
                return tables;
            }

            // ── Render Table ──
function renderTable(rows) {
    if (!rows.length) return '<p style="color:var(--text-muted)">No data.</p>';
    const [header, ...body] = rows;
    const maxCols = Math.max(...rows.map(r => r.length));
    return `
        <table>
            <thead>
                <tr>
                    ${Array.from({length: maxCols}, (_, i) =>
                        `<th>${header[i] || ''}</th>`
                    ).join('')}
                </tr>
            </thead>
            <tbody>
                ${body.map(row => `
                    <tr>
                        ${Array.from({length: maxCols}, (_, i) =>
                            `<td>${row[i] || ''}</td>`
                        ).join('')}
                    </tr>
                `).join('')}
            </tbody>
        </table>
    `;
}

// ── Render Awards Table ──
function renderAwardsTable(rows) {
    if (!rows.length) return '<p style="color:var(--text-muted)">No data.</p>';
    const [header, ...body] = rows;
    const maxCols = Math.max(...rows.map(r => r.length));
    return `
        <table>
            <thead>
                <tr>
                    ${Array.from({length: maxCols}, (_, i) =>
                        `<th>${header[i] || ''}</th>`
                    ).join('')}
                </tr>
            </thead>
            <tbody>
                ${body.map(row => `
                    <tr>
                        ${Array.from({length: maxCols}, (_, i) =>
                            `<td class="${i === 1 ? 'awards-year' : ''}">${row[i] || ''}</td>`
                        ).join('')}
                    </tr>
                `).join('')}
            </tbody>
        </table>
    `;
}

            // ── Load Records ──
            async function loadRecords() {
                const rows = await fetchTab('RECORD ROOM');
                const tables = parseTables(rows);

                if (!tables.length) {
                    document.getElementById('recordsContainer').innerHTML =
                        '<p style="color:var(--text-muted)">No records found.</p>';
                    return;
                }

                document.getElementById('recordsContainer').innerHTML = tables.map(table => `
    <div class="record-block">
        <h2 class="section-title">${table.title}</h2>
        <div class="table-wrapper">
            ${table.title.toLowerCase().includes('award')
                ? renderAwardsTable(table.rows)
                : renderTable(table.rows)}
        </div>
    </div>
`).join('');
            }

            // ── Init ──
            loadRecords();

        })();
    </script>
</body>
</html>
